name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp cryptography PyYAML pytest ruff voluptuous WSDiscovery==2.1.2
      - name: Ruff
        run: python -m ruff check custom_components tests
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Unit tests
        run: python -m pytest -q tests
